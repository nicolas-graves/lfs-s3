# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Make build on release

on:
  release: 
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            in_asset: lfs-s3
            out_asset: lfs-s3-linux          # Linux binary
          - os: macos-latest
            in_asset: lfs-s3
            out_asset: lfs-s3-mac           # macOS binary
          - os: windows-latest
            in_asset: lfs-s3.exe
            out_asset: lfs-s3-windows.exe        # Windows binary
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Build
      run: go build -v -ldflags "-s -w"
    - name: Upload Release Asset
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.event.release.tag_name }}
        IN_ASSET: ${{ matrix.in_asset }}
        OUT_ASSET: ${{ matrix.out_asset }}
      run: |
        mv "$IN_ASSET" "$OUT_ASSET"
        gh release upload "$TAG" "$OUT_ASSET" --clobber
